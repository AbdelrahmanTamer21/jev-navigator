name: tests

on:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
        typesafe: ["with", "without"]
        include:
          - typesafe: with
            run: pytest -q -rs
          - typesafe: without
            run: --no-dev --with pytest pytest -q -rs --without-typesafe
    name: test (Python ${{ matrix.python }}, ${{ matrix.typesafe }} TypeSafe)
    steps:
      - uses: actions/checkout@v7
      - name: Install uv, ast-grep and ripgrep
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install ast-grep-cli
          sudo apt-get update -q && sudo apt-get install -y -q ripgrep
      - run: uv run --python ${{ matrix.python }} ${{ matrix.run }}
